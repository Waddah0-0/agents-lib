[project]
name = "agents-lib-workspace"
version = "0.1.0"
description = "Monorepo workspace for agents-lib"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "agents/*",
]

[tool.uv.sources]
agents-lib-core = { workspace = true }
agents-lib-cli = { workspace = true }
agents-lib-api = { workspace = true }
agents-lib-ai-code-detector = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "ASYNC",  # flake8-async
]
ignore = []

[tool.mypy]
python_version = "3.11"
mypy_path = [
    "packages/core/src",
    "packages/cli/src",
    "packages/api/src",
    "agents/ai_code_detector/src",
]
files = [
    "packages",
    "agents",
]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "packages",
    "agents",
]
asyncio_mode = "auto"
