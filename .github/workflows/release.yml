name: Release

# Publish to PyPI when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0),
# or by hand to TestPyPI first (Actions > Release > Run workflow).
#
# No PyPI password or token is stored anywhere: PyPI trusts this workflow directly
# ("trusted publishing"). Versions that are already on PyPI are skipped, so a tag publishes
# only the packages whose version changed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: |
          uv python install 3.12
          uv sync --all-packages
          npm ci --prefix ui

      - name: Build, check and smoke-test the packages
        run: uv run python scripts/build_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'push' || inputs.target == 'pypi') && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ (github.event_name == 'push' || inputs.target == 'pypi') && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          skip-existing: true
