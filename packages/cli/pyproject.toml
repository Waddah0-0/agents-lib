[project]
name = "agents-lib-cli"
version = "0.1.0"
description = "CLI tool for running and managing agents in agents-lib"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agents-lib-core",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
agents = "agents_cli.main:app"

[tool.uv.sources]
agents-lib-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_cli"]
