[project]
name = "margin-cli"
version = "0.1.0"
description = "CLI tool for running and managing agents in margin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "margin-core",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
margin = "margin_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margin_cli"]
