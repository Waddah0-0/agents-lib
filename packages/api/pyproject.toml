[project]
name = "margin-api"
version = "0.1.0"
description = "HTTP API server for margin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "margin-core",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.0",
]

[project.scripts]
margin-api = "margin_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margin_api"]
