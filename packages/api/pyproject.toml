[project]
name = "agents-lib-api"
version = "0.1.0"
description = "HTTP API server for agents-lib"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agents-lib-core",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.0",
]

[project.scripts]
agents-api = "agents_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_api"]
